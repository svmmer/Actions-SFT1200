name: Manual candidate build

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        type: boolean
        required: false
        default: false
      publish_release:
        description: 'Publish when testing main'
        type: boolean
        required: false
        default: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch the canonical locked build
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_ENABLED: ${{ inputs.ssh }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          gh workflow run build-openwrt.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f "ssh=$SSH_ENABLED" \
            -f "publish_release=$PUBLISH_RELEASE" \
            -f "expected_sha=$GITHUB_SHA"
          echo "Dispatched the canonical build on $GITHUB_REF_NAME"
