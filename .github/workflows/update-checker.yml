name: Validate and promote upstream updates

on:
  workflow_dispatch:
  schedule:
    # Version checks are cheap; firmware builds run only for a new PassWall or Xray release.
    - cron: '40 */12 * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: validated-source-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout stable main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Test the proxy version update gate
        run: python3 -m unittest -v tests/test_source_lock_update_gate.py

      - name: Create locked update candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source-lock.py validate sources.lock
          # shellcheck source=/dev/null
          source sources.lock

          remote_head() {
            local repository="$1"
            local branch="$2"
            local revision
            revision=$(git ls-remote "$repository" "refs/heads/$branch" | awk 'NR == 1 { print $1 }')
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "$revision"
          }

          NEW_PASSWALL_REV=$(remote_head "$PASSWALL_REPO" "$PASSWALL_BRANCH")
          NEW_PWPACKAGES_REV=$(remote_head "$PWPACKAGES_REPO" "$PWPACKAGES_BRANCH")
          NEW_GOLANG_REV=$(remote_head "$GOLANG_REPO" "$GOLANG_BRANCH")

          PASSWALL_MAKEFILE=$(curl --retry 3 --retry-all-errors -fsSL \
            "https://raw.githubusercontent.com/Openwrt-Passwall/openwrt-passwall/${NEW_PASSWALL_REV}/luci-app-passwall/Makefile")
          XRAY_MAKEFILE=$(curl --retry 3 --retry-all-errors -fsSL \
            "https://raw.githubusercontent.com/Openwrt-Passwall/openwrt-passwall-packages/${NEW_PWPACKAGES_REV}/xray-core/Makefile")

          NEW_PASSWALL_VERSION=$(sed -n 's/^PKG_VERSION:=//p' <<< "$PASSWALL_MAKEFILE" | head -n1)
          NEW_PASSWALL_RELEASE=$(sed -n 's/^PKG_RELEASE:=//p' <<< "$PASSWALL_MAKEFILE" | head -n1)
          NEW_XRAY_VERSION=$(sed -n 's/^PKG_VERSION:=//p' <<< "$XRAY_MAKEFILE" | head -n1)
          NEW_XRAY_RELEASE=$(sed -n 's/^PKG_RELEASE:=//p' <<< "$XRAY_MAKEFILE" | head -n1)
          test -n "$NEW_PASSWALL_VERSION"
          test -n "$NEW_PASSWALL_RELEASE"
          test -n "$NEW_XRAY_VERSION"
          test -n "$NEW_XRAY_RELEASE"

          UPDATE_NEEDED=$(python3 scripts/source-lock.py proxy-update-needed sources.lock \
            "PASSWALL_REV=$NEW_PASSWALL_REV" \
            "PWPACKAGES_REV=$NEW_PWPACKAGES_REV" \
            "GOLANG_REV=$NEW_GOLANG_REV" \
            "PASSWALL_PKG_VERSION=$NEW_PASSWALL_VERSION" \
            "PASSWALL_PKG_RELEASE=$NEW_PASSWALL_RELEASE" \
            "XRAY_PKG_VERSION=$NEW_XRAY_VERSION" \
            "XRAY_PKG_RELEASE=$NEW_XRAY_RELEASE")

          if [ "$UPDATE_NEEDED" = false ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## No firmware build needed"
              echo
              echo "PassWall and Xray-core versions are unchanged."
              echo "Revision-only upstream changes do not trigger a build."
              echo
              echo "- PassWall: \`${PASSWALL_PKG_VERSION}-${PASSWALL_PKG_RELEASE}\`"
              echo "- Xray-core: \`${XRAY_PKG_VERSION}-${XRAY_PKG_RELEASE}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE_SHA=$(git rev-parse HEAD)
          CANDIDATE_BRANCH=automation/source-update
          git switch -C "$CANDIDATE_BRANCH"
          python3 scripts/source-lock.py update sources.lock \
            "PASSWALL_REV=$NEW_PASSWALL_REV" \
            "PWPACKAGES_REV=$NEW_PWPACKAGES_REV" \
            "GOLANG_REV=$NEW_GOLANG_REV" \
            "PASSWALL_PKG_VERSION=$NEW_PASSWALL_VERSION" \
            "PASSWALL_PKG_RELEASE=$NEW_PASSWALL_RELEASE" \
            "XRAY_PKG_VERSION=$NEW_XRAY_VERSION" \
            "XRAY_PKG_RELEASE=$NEW_XRAY_RELEASE"
          python3 scripts/source-lock.py validate sources.lock

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.lock
          git commit -m "chore: update validated proxy sources"
          CANDIDATE_SHA=$(git rev-parse HEAD)

          REMOTE_CANDIDATE=$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk 'NR == 1 { print $1 }')
          if [ -n "$REMOTE_CANDIDATE" ]; then
            git push \
              --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$REMOTE_CANDIDATE" \
              origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          fi

          {
            echo "changed=true"
            echo "base_sha=$BASE_SHA"
            echo "branch=$CANDIDATE_BRANCH"
            echo "sha=$CANDIDATE_SHA"
            echo "passwall_version=${NEW_PASSWALL_VERSION}-${NEW_PASSWALL_RELEASE}"
            echo "xray_version=${NEW_XRAY_VERSION}-${NEW_XRAY_RELEASE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Candidate source update"
            echo
            echo "- PassWall: \`${NEW_PASSWALL_VERSION}-${NEW_PASSWALL_RELEASE}\` (\`${NEW_PASSWALL_REV}\`)"
            echo "- Xray-core: \`${NEW_XRAY_VERSION}-${NEW_XRAY_RELEASE}\` (\`${NEW_PWPACKAGES_REV}\`)"
            echo "- Go toolchain: \`${NEW_GOLANG_REV}\`"
            echo
            echo "Stable main is unchanged until the candidate firmware succeeds."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the full candidate firmware build
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run build-openwrt.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$CANDIDATE_BRANCH" \
            -f ssh=false \
            -f publish_release=false \
            -f "expected_sha=$CANDIDATE_SHA"

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build-openwrt.yml \
              --commit "$CANDIDATE_SHA" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            echo "Waiting for candidate run registration ($attempt/30)"
            sleep 2
          done
          test -n "$RUN_ID"
          echo "Candidate build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          gh run watch "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --compact \
            --exit-status \
            --interval 30

      - name: Promote the validated lock and start production build
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail

          assert_locked_revision_on_branch() {
            local name="$1"
            local repository="$2"
            local branch="$3"
            local revision="$4"
            local graph="$GUARD_ROOT/$name"
            local current

            git init --quiet --bare "$graph"
            # Keep the complete reachable commit graph. Filtering out trees
            # and blobs makes this cheap without introducing shallow-history
            # false negatives.
            if ! git -C "$graph" fetch --quiet --no-tags --filter=tree:0 \
              "$repository" "refs/heads/$branch"; then
              echo "Unable to inspect $name upstream history" >&2
              return 1
            fi

            current=$(git -C "$graph" rev-parse FETCH_HEAD)
            if ! git -C "$graph" cat-file -e "${revision}^{commit}" 2>/dev/null || \
               ! git -C "$graph" merge-base --is-ancestor "$revision" "$current"; then
              echo "$name locked revision $revision is no longer in" \
                "$branch history (current $current); refusing promotion" >&2
              return 1
            fi

            echo "$name lock remains in $branch history at $current"
          }

          python3 scripts/source-lock.py validate sources.lock
          # shellcheck source=/dev/null
          source sources.lock
          GUARD_ROOT=$(mktemp -d "$RUNNER_TEMP/source-guard.XXXXXX")
          trap 'rm -rf "$GUARD_ROOT"' EXIT

          git fetch origin main:refs/remotes/origin/main
          CURRENT_MAIN=$(git rev-parse origin/main)
          if [ "$CURRENT_MAIN" != "$BASE_SHA" ]; then
            echo "main advanced from $BASE_SHA to $CURRENT_MAIN; refusing a stale promotion" >&2
            exit 1
          fi

          # A candidate can finish from an exact SHA even if an upstream
          # force-push removed that commit during the build. Do not promote
          # such a temporary, garbage-collectable lock to stable main.
          assert_locked_revision_on_branch \
            PassWall "$PASSWALL_REPO" "$PASSWALL_BRANCH" "$PASSWALL_REV"
          assert_locked_revision_on_branch \
            PWpackages "$PWPACKAGES_REPO" "$PWPACKAGES_BRANCH" "$PWPACKAGES_REV"
          assert_locked_revision_on_branch \
            Go "$GOLANG_REPO" "$GOLANG_BRANCH" "$GOLANG_REV"

          git push origin "${CANDIDATE_SHA}:refs/heads/main"
          git push \
            --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$CANDIDATE_SHA" \
            origin --delete "$CANDIDATE_BRANCH" || true
          gh workflow run build-openwrt.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f ssh=false \
            -f publish_release=true \
            -f "expected_sha=$CANDIDATE_SHA"

          {
            echo
            echo "Candidate firmware passed. The lock was fast-forwarded to main,"
            echo "and a production release build was dispatched."
          } >> "$GITHUB_STEP_SUMMARY"
