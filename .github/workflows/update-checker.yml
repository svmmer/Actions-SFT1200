name: PassWall and Xray Version Checker

on:
  workflow_dispatch:
  schedule:
    # Lightweight version check every 12 hours.
    - cron: '40 */12 * * *'

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Read upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          PASSWALL_MAKEFILE=$(curl -fsSL \
            https://raw.githubusercontent.com/Openwrt-Passwall/openwrt-passwall/main/luci-app-passwall/Makefile)
          XRAY_MAKEFILE=$(curl -fsSL \
            https://raw.githubusercontent.com/Openwrt-Passwall/openwrt-passwall-packages/main/xray-core/Makefile)
          PASSWALL_VERSION=$(sed -n 's/^PKG_VERSION:=//p' <<< "$PASSWALL_MAKEFILE" | head -n1)
          XRAY_VERSION=$(sed -n 's/^PKG_VERSION:=//p' <<< "$XRAY_MAKEFILE" | head -n1)
          test -n "$PASSWALL_VERSION"
          test -n "$XRAY_VERSION"
          echo "passwall=$PASSWALL_VERSION" >> "$GITHUB_OUTPUT"
          echo "xray=$XRAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "PassWall: $PASSWALL_VERSION"
          echo "Xray: $XRAY_VERSION"

      - name: Check whether either version changed
        id: version-cache
        uses: actions/cache@v4
        with:
          path: .upstream-version-marker
          key: upstream-v2-passwall-${{ steps.versions.outputs.passwall }}-xray-${{ steps.versions.outputs.xray }}

      - name: Save current version marker
        if: steps.version-cache.outputs.cache-hit != 'true'
        run: |
          printf 'PassWall=%s\nXray=%s\n' \
            '${{ steps.versions.outputs.passwall }}' \
            '${{ steps.versions.outputs.xray }}' > .upstream-version-marker

      - name: Trigger firmware build for new version
        if: steps.version-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-openwrt.yml --repo "${{ github.repository }}" --ref main
