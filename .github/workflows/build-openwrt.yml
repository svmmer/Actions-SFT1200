name: Build OpenWrt

on:
  schedule:
    # GitHub Actions cron uses UTC: Sunday 19:00 UTC = Monday 03:00 Asia/Shanghai.
    - cron: '0 19 * * 0'
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        type: boolean
        required: false
        default: false
      publish_release:
        description: 'Publish firmware to Releases (main branch only)'
        type: boolean
        required: false
        default: true
      expected_sha:
        description: 'Optional commit guard used by the automatic updater'
        type: string
        required: false
        default: ''

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

# Compilation runs with a read-only token. Only the post-build publishing job
# receives write permission, and candidate branches never enter that job.
permissions: {}

env:
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      status: ${{ steps.compile.outputs.status }}
      passwall_version: ${{ steps.compile.outputs.passwall_version }}
      xray_version: ${{ steps.compile.outputs.xray_version }}

    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Optimize Disk Space"
      uses: "hugoalh/disk-space-optimizer-ghaction@473a0f269fe1dd4642c48518a323b231680428aa"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Free up disk space complete
      run: |
        # Keep the workspace on the root filesystem. Repartitioning the free
        # space into a workspace LVM starves apt/dpkg of root filesystem space.
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Validate locked sources
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha }}
      run: |
        set -euo pipefail
        if [ -n "$EXPECTED_SHA" ]; then
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        fi
        python3 scripts/source-lock.py validate sources.lock
        python3 scripts/source-lock.py env sources.lock >> "$GITHUB_ENV"
        echo "SOURCE_LOCK_FILE=$GITHUB_WORKSPACE/sources.lock" >> "$GITHUB_ENV"

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d* /usr/local/lib/android* /etc/docker* /etc/firefox* /etc/mysql* /etc/php* /opt/google* /usr/share/dotnet* /usr/share/google* /usr/share/moby* /usr/share/mysql* /usr/share/php*
        sudo -E apt-get -qq update
        sudo add-apt-repository universe
        sudo apt-get update
        read -r -a BUILD_DEPENDENCIES < "$GITHUB_WORKSPACE/build-support/depends-ubuntuLTS"
        sudo -E apt-get -qq install "${BUILD_DEPENDENCIES[@]}"
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo chown "$USER:$(id -gn)" "$GITHUB_WORKSPACE"

    - name: Clone source code
      working-directory: ./
      run: |
        set -euo pipefail
        df -hT "$PWD"
        git clone --branch "$BUILDER_BRANCH" --single-branch "$BUILDER_REPO" openwrt
        git -C openwrt checkout --detach "$BUILDER_REV"
        test "$(git -C openwrt rev-parse HEAD)" = "$BUILDER_REV"
        ln -sf /openwrt "$GITHUB_WORKSPACE/openwrt"
        cd openwrt
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        # Prepare the patched Siflower SDK only. The repository .config is
        # loaded later, after custom feeds have replaced the SDK defaults.
        python3 setup.py -c ./configs/config-siflower-18.x.yml

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/openwrt-18.06/siflower/openwrt-18.06/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt/openwrt-18.06/siflower/openwrt-18.06 && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt/openwrt-18.06/siflower/openwrt-18.06 && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/openwrt-18.06/siflower/openwrt-18.06/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/openwrt-18.06/siflower/openwrt-18.06/.config
        chmod +x $DIY_P2_SH
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@71006b93bff498b020448ac10964f8a5d0f9f32c
      if: inputs.ssh || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        make download -j8
        
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        echo -e "$(nproc) thread compile"    
        # The vendor Siflower 18.06 image rules build factory and sysupgrade
        # images through the same temporary kernel.bin.  In a parallel build,
        # check-size can race the command that creates that file and falsely
        # report a sub-4 MiB kernel as "too big".  Keep the fast parallel build,
        # then retry incrementally with one job so the image rules are ordered.
        if ! make -j$(nproc) V=s; then
          echo "Parallel build failed; retrying incrementally with serialized image rules"
          make -j1 V=s
        fi
        PASSWALL_STATUS=$(find build_dir -path '*/root-*/usr/lib/opkg/status' \
          ! -path '*/root.orig-*' -type f -print -quit)
        test -n "$PASSWALL_STATUS"
        ROOTFS_DIR=${PASSWALL_STATUS%/usr/lib/opkg/status}
        awk 'BEGIN { RS="" } /(^|\n)Package: luci-app-passwall(\n|$)/ && /(^|\n)Version: [^\n]+(\n|$)/ { found=1 } END { exit !found }' "$PASSWALL_STATUS"
        awk 'BEGIN { RS="" } /(^|\n)Package: xray-core(\n|$)/ { found=1 } END { exit !found }' "$PASSWALL_STATUS"
        awk 'BEGIN { RS="" } /(^|\n)Package: luci-theme-argon(\n|$)/ && /(^|\n)Version: 1\.8\.4-/ { found=1 } END { exit !found }' "$PASSWALL_STATUS"
        test -x "$ROOTFS_DIR/usr/bin/xray"
        test -d "$ROOTFS_DIR/www/luci-static/argon"
        awk 'BEGIN { RS="" } /(^|\n)Package: luci-app-passwall(\n|$)/ || /(^|\n)Package: xray-core(\n|$)/ { print }' "$PASSWALL_STATUS"
        PASSWALL_VERSION=$(awk 'BEGIN { RS=""; FS="\n" } /(^|\n)Package: luci-app-passwall(\n|$)/ { for (i = 1; i <= NF; i++) if ($i ~ /^Version: /) { sub(/^Version: /, "", $i); print $i; exit } }' "$PASSWALL_STATUS")
        XRAY_VERSION=$(awk 'BEGIN { RS=""; FS="\n" } /(^|\n)Package: xray-core(\n|$)/ { for (i = 1; i <= NF; i++) if ($i ~ /^Version: /) { sub(/^Version: /, "", $i); print $i; exit } }' "$PASSWALL_STATUS")
        test "$PASSWALL_VERSION" = "${PASSWALL_PKG_VERSION}-${PASSWALL_PKG_RELEASE}"
        test "$XRAY_VERSION" = "${XRAY_PKG_VERSION}-${XRAY_PKG_RELEASE}"
        echo "PASSWALL_VERSION=$PASSWALL_VERSION" >> "$GITHUB_ENV"
        echo "XRAY_VERSION=$XRAY_VERSION" >> "$GITHUB_ENV"
        echo "passwall_version=$PASSWALL_VERSION" >> "$GITHUB_OUTPUT"
        echo "xray_version=$XRAY_VERSION" >> "$GITHUB_OUTPUT"
        # make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Add build date to firmware names
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06/bin/targets/siflower
        BUILD_DATE=$(date +"%Y%m%d")
        for firmware in *squashfs-factory.img *squashfs-sysupgrade.tar *root.squashfs; do
          [ -e "$firmware" ] || continue
          case "$firmware" in
            *.img)      dated_name="${firmware%.img}-${BUILD_DATE}.img" ;;
            *.tar)      dated_name="${firmware%.tar}-${BUILD_DATE}.tar" ;;
            *.squashfs) dated_name="${firmware%.squashfs}-${BUILD_DATE}.squashfs" ;;
          esac
          mv "$firmware" "$dated_name"
          echo "Firmware: $dated_name"
        done
        test "$(find . -maxdepth 1 -type f -name "*-${BUILD_DATE}.*" | wc -l)" -eq 3

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/bin
        retention-days: 7
        if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.status == 'success' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_release)
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout locked metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download compiled firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: OpenWrt_bin*
          path: firmware-bin
          merge-multiple: true

      - name: Generate release information
        id: tag
        env:
          PASSWALL_VERSION: ${{ needs.build.outputs.passwall_version }}
          XRAY_VERSION: ${{ needs.build.outputs.xray_version }}
        run: |
          set -euo pipefail
          python3 scripts/source-lock.py validate sources.lock
          # shellcheck source=/dev/null
          source sources.lock
          echo "release_tag=$(TZ=Asia/Shanghai date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
          {
            echo "## Package versions"
            echo
            echo "- PassWall: \`$PASSWALL_VERSION\`"
            echo "- Xray-core: \`$XRAY_VERSION\`"
            echo "- PassWall source: \`$PASSWALL_REV\`"
            echo "- PWpackages source: \`$PWPACKAGES_REV\`"
            echo "- Go toolchain source: \`$GOLANG_REV\`"
          } > release.txt

      - name: Upload firmware to release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: firmware-bin/targets/siflower/openwrt-*squashfs*
          fail_on_unmatched_files: true

      - name: Delete old workflow runs
        uses: wekingchen/delete-workflow-runs@18cc2e8a00d8f622c2e7a882dee2854329609526
        with:
          retain_days: 30
          keep_minimum_runs: 10

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
